- type: entity
  name: masochistic chair
  id: MasochisticChair
  parent: BaseStructure
  description: A chair designed to be as comfortable as possible, just begging you to TRY to escape
  components:
  - type: Sprite
    sprite: _HL/Structures/Furniture/maso-chair.rsi
    layers:
    - state: unlocked
      map: [ "enum.StrapVisuals.State" ]

    noRot: true
  - type: Appearance
  - type: Physics
  - type: Transform
    noRot: true
  - type: Anchorable
  - type: Strap
    lockable: true
    position: Stand
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Inflatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

